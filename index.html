<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SystemOS Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom scrollbar to match the terminal aesthetic */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }

      /* RGB Icon Animation (Simple Pulse) */
      @keyframes rgb-pulse {
        0% { color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        25% { color: #eab308; text-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }
        50% { color: #22c55e; text-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }
        75% { color: #3b82f6; text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        100% { color: #a855f7; text-shadow: 0 0 10px rgba(168, 85, 247, 0.5); }
      }
      
      .rgb-effect {
        animation: rgb-pulse 3s infinite linear alternate;
      }

      /* Detailed RGB Flow Animation for Text - SMOOTH VERSION */
      @keyframes rgb-flow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      
      .luazarops-effect {
        /* Detailed RGB Gradient - Pastel/Neon mix for smoothness */
        background: linear-gradient(
          270deg,
          #ff4d4d,
          #ffaf40,
          #fffa65,
          #32ff7e,
          #7efff5,
          #18dcff,
          #7d5fff,
          #ff4d4d
        );
        background-size: 600% 600%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        /* Increased duration to 12s for "bem suave" effect */
        animation: rgb-flow 12s ease-in-out infinite;
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.15));
      }

      /* Print Styles for PDF Export */
      @media print {
        body * {
          visibility: hidden;
        }
        body {
          background-color: white !important;
          color: black !important;
          overflow: visible !important;
        }
        #printable-section, #printable-section * {
          visibility: visible;
        }
        #printable-section {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 20px;
          background: white !important;
          color: black !important;
        }
        /* Override Dark Mode styles for print */
        #printable-section .note-card {
          background: white !important;
          border: 1px solid #ccc !important;
          box-shadow: none !important;
          color: black !important;
          margin-bottom: 10px;
          break-inside: avoid;
        }
        #printable-section .text-slate-200 { color: black !important; }
        #printable-section .text-slate-500 { color: #444 !important; }
        #printable-section .text-slate-400 { color: #666 !important; }
        #printable-section .text-yellow-400 { color: #000 !important; font-weight: bold !important; }
        /* Hide buttons inside the printable section if any accidentally get in */
        .no-print-in-section { display: none !important; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://esm.run/@google/genai"
  }
}
</script>
</head>
  <body class="bg-slate-950 text-slate-100 font-mono antialiased overflow-hidden">
    <div id="root"></div>
  </body>
</html>
